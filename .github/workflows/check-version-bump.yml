name: Check spec version bump

on:
  pull_request:
    branches: [main]

jobs:
  check-version-bump:
    name: Check spec version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require info.version bump for changed specs
        run: bash .github/scripts/check-version-bump.sh "${{ github.event.pull_request.base.sha }}"
