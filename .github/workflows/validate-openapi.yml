name: Validate OpenAPI specs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate ${{ matrix.spec }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - edgegap-v1-openapi.yaml
          - edgegap-v2-openapi.yaml

    # Run Swagger Editor locally so specs are not sent to editor.swagger.io.
    # Pinned to Swagger Editor 4: swagger-editor-validate drives the Editor 4 UI
    # and times out against Editor 5 (the current `latest`). Editor 4 serves on 8080.
    services:
      swagger-editor:
        image: swaggerapi/swagger-editor:v4.14.8
        ports:
          - 80:8080

    steps:
      - uses: actions/checkout@v4

      - name: Validate ${{ matrix.spec }}
        uses: swaggerexpert/swagger-editor-validate@v1
        with:
          swagger-editor-url: http://localhost/
          definition-file: ${{ matrix.spec }}
          default-timeout: 20000
